[package]
name = "tinyvoice-hotkey-win"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
publish = false
description = "Owned, joined Windows keyboard-hook boundary for TinyVoice."

[workspace]

[dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
# This standalone crate is the single reviewed Win32 pointer/FFI boundary.
# tinyvoice and tinyvoice-module continue to forbid unsafe code entirely.
unsafe_code = "allow"
missing_docs = "warn"
